map $request_method $isupipe_timeline_backend {
  default isupipe_workers;
  GET isupipe_read_workers;
}

upstream isupipe_read_workers {
  server 10.99.0.13:8080 max_fails=2 fail_timeout=2s;
  server 10.99.0.12:8080 backup;
  keepalive 64;
}

upstream isupipe_workers {
  server 10.99.0.12:8080 max_fails=2 fail_timeout=2s;
  server 127.0.0.1:8080 backup;
  keepalive 64;
}

upstream isupipe_backend {
  server 127.0.0.1:8080;
  keepalive 64;
}

server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は有効期限がきれています
  ssl_certificate     /etc/nginx/tls/_.t.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.t.isucon.dev.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  location / {
    try_files $uri /index.html;
  }
  location = /api/initialize {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isupipe_backend;
  }
  location = /api/register {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isupipe_backend;
  }
  location = /api/livestream/search {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_pass http://isupipe_read_workers;
  }
  location ~ ^/api/user/[^/]+/icon$ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_pass http://isupipe_read_workers;
  }
  location ~ ^/api/(tag|login)$ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_pass http://isupipe_backend;
  }
  location ~ ^/api/livestream/[0-9]+/(livecomment|reaction)$ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_pass http://$isupipe_timeline_backend;
  }
  location ~ ^/api/(livestream(/[0-9]+(/(report|ngwords|statistics))?)?|user/[^/]+/(theme|livestream|statistics))$ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_pass http://$isupipe_timeline_backend;
  }
  location /api {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isupipe_workers;
  }
}