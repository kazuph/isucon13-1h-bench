stream {
    server {
        listen 0.0.0.0:53 udp reuseport;
        listen [::]:53 udp reuseport;
        proxy_pass 10.99.0.13:53;
        proxy_requests 1;
        proxy_responses 1;
        proxy_timeout 2s;
    }

    server {
        listen 0.0.0.0:53;
        listen [::]:53;
        proxy_pass 10.99.0.13:53;
        proxy_connect_timeout 1s;
        proxy_timeout 10s;
    }
}
