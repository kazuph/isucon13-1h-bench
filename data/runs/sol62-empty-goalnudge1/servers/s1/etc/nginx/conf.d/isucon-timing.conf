split_clients "$request_id" $isupipe_timing_sample {
    2% 1;
    * 0;
}

log_format isupipe_timing escape=json
    '{"method":"$request_method","path":"$uri","status":$status,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"upstream":"$upstream_addr","bytes":$body_bytes_sent}';

access_log /var/log/nginx/isupipe-timing.log isupipe_timing buffer=64k flush=1s if=$isupipe_timing_sample;
