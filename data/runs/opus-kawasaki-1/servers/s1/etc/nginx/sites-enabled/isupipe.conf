upstream app {
  server 127.0.0.1:8080;
  keepalive 128;
}

server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl http2 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は有効期限がきれています
  ssl_certificate     /etc/nginx/tls/_.t.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.t.isucon.dev.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl http2;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  location / {
    try_files $uri /index.html;
  }
  access_log /var/log/nginx/access.log ltsv;
  location ~ ^/api/user/([0-9A-Za-z_.-]+)/icon$ {
    set $iuser $1;
    set $inm "none";
    if ($http_if_none_match ~ "^\"?([0-9a-f]{64})\"?$") {
      set $inm $1;
    }
    if (-f /home/isucon/icons/$iuser/$inm) {
      return 304;
    }
    if (-f /home/isucon/icons/$iuser.jpg) {
      rewrite ^ /icons-internal/$iuser.jpg last;
    }
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://app;
  }
  location /icons-internal/ {
    internal;
    alias /home/isucon/icons/;
    default_type image/jpeg;
    etag off;
    if_modified_since off;
    add_header Last-Modified "";
  }
  location /api {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://app;
  }
}