map "$request_method:$http_if_none_match" $image_digest {
  default invalid;
  '~^(?:GET|HEAD):"(?<sha256>[0-9a-f]{64})"$' $sha256;
}
upstream isupipe_app {
  server 10.99.0.13:8080;
  keepalive 64;
}
server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は有効期限がきれています
  ssl_certificate     /etc/nginx/tls/_.t.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.t.isucon.dev.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  access_log /var/log/nginx/isupipe-sample.log isupipe_sample buffer=32k flush=2s if=$sample_request;
  ssl_session_cache shared:ISUPipeSSL:12m;
  ssl_session_timeout 10m;
  keepalive_timeout 75s;
  keepalive_requests 10000;
  client_max_body_size 10m;
  client_body_buffer_size 128k;
  proxy_buffers 16 16k;
  proxy_busy_buffers_size 64k;
  proxy_max_temp_file_size 0;
  root /home/isucon/webapp/public/;
  location / {
    try_files $uri /index.html;
  }
  location ~ "^/api/user/(?<icon_account>[A-Za-z0-9_-]{1,63})/icon$" {
    if (-f /run/isupipe-edge/icons/$icon_account/$image_digest) {
      add_header ETag $http_if_none_match;
      return 304;
    }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isupipe_app;
  }
  location = /api/icon {
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isupipe_app;
  }
  location /api {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isupipe_app;
  }
}