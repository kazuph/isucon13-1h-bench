gzip_types application/json;
gzip_comp_level 1;
gzip_min_length 1024;
log_format isupipe_perf '$request_method $uri $status $body_bytes_sent $request_time $upstream_response_time $gzip_ratio $http_accept_encoding';
access_log /var/log/nginx/isupipe-perf.log isupipe_perf buffer=64k flush=1s;
proxy_cache_path /var/cache/nginx/isupipe-icons levels=1:2 keys_zone=isupipe_icons:16m inactive=10m max_size=256m use_temp_path=off;
