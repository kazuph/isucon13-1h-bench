launch=lmdb
lmdb-filename=/var/lib/powerdns/isupipe.lmdb
lmdb-shards=4
lmdb-sync-mode=sync
api=yes
api-key=isudns
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=127.0.0.1,10.99.0.0/24,::1
local-port=53
security-poll-suffix=
setgid=pdns
setuid=pdns
cache-ttl=0
negquery-cache-ttl=0
query-cache-ttl=0
zone-cache-refresh-interval=60
log-dns-queries=no
log-dns-details=no
loglevel=3
