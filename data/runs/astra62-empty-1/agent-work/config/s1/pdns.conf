api=yes
webserver=yes
include-dir=/etc/powerdns/pdns.d
launch=bind
bind-config=/etc/powerdns/named.conf
local-port=53
security-poll-suffix=
setgid=pdns
setuid=pdns
cache-ttl=0
negquery-cache-ttl=0
query-cache-ttl=0
zone-cache-refresh-interval=0
zone-metadata-cache-ttl=60

log-dns-queries=no
loglevel=3
log-dns-details=no

