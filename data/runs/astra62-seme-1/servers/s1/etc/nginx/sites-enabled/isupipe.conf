map $http_if_none_match $client_icon_hash {
  default "-";
  '~^"([a-f0-9]{64})"$' $1;
}
proxy_cache_path /var/cache/nginx/isupipe levels=1:2 keys_zone=icons:8m max_size=256m inactive=1m;
upstream app_main { server 10.99.0.13:8080; keepalive 128; }
upstream app_login { server 10.99.0.12:8080; keepalive 32; }
server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl http2 default_server reuseport backlog=4096;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は有効期限がきれています
  ssl_certificate     /etc/nginx/tls/_.t.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.t.isucon.dev.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl http2;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  access_log off;
  gzip_types application/json;
  gzip_comp_level 1;
  gzip_min_length 768;
  keepalive_requests 10000;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  ssl_session_cache shared:ISU:16m;
  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  location / {
    try_files $uri /index.html;
  }
  location ~ ^/api/user/(?<icon_user>[a-zA-Z0-9_-]+)/icon$ {
    root /var/lib/isupipe-icons/current;
    etag off;
    if_modified_since off;
    if (-f $document_root/users/$icon_user/match.$client_icon_hash) { return 304; }
    try_files /users/$icon_user/image.jpg @icon_api;
  }
  location @icon_api {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_pass http://app_main;
  }
  location = /api/login {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_pass http://app_login;
  }
  location /api {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_pass http://app_main;
  }
}