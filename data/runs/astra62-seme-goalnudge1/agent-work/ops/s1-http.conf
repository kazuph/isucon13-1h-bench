upstream pipe_api { server 127.0.0.1:8080; keepalive 64; }
upstream pipe_login { server 10.99.0.12:8080; keepalive 32; }
server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

