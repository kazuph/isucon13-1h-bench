log_format pipe_timing '$msec|$request_method|$uri|$status|$request_time|$upstream_response_time|$bytes_sent|$request_length|$connection_requests|$ssl_session_reused|$server_protocol';
map $http_if_none_match $pipe_icon_hash {
    default invalid;
    '~^"([0-9a-f]{64})"$' $1;
}
upstream pipe_api { server 10.99.0.11:8080; keepalive 64; }
upstream pipe_login { server 10.99.0.12:8090; keepalive 32; }
server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は有効期限がきれています
  ssl_certificate     /etc/nginx/tls/_.t.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.t.isucon.dev.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl http2;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  ssl_session_cache shared:pipe_tls:16m;
  ssl_session_timeout 10m;
  keepalive_requests 10000;
  tcp_nodelay on;
  proxy_buffers 16 16k; proxy_buffer_size 16k; proxy_busy_buffers_size 64k;
  access_log /var/log/nginx/pipe_timing.log pipe_timing buffer=256k flush=1s;
  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  location / {
    try_files $uri /index.html;
  }
  location ~ ^/api/user/(?<icon_user>[A-Za-z0-9_-]+)/icon$ {
    root /var/lib/isupipe-icons/current;
    if (-f $document_root/$icon_user/$pipe_icon_hash) { return 304; }
    default_type image/jpeg;
    etag off;
    try_files /$icon_user/image @pipe_icon;
  }
  location @pipe_icon {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://pipe_api;
  }
  location = /api/login {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://pipe_login;
  }
  location /api {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://pipe_api;
  }
}