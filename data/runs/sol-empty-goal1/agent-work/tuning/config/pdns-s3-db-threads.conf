api=yes
api-key=isudns
webserver=yes
include-dir=/etc/powerdns/pdns.d
launch=gmysql
gmysql-host=10.99.0.13
gmysql-port=3306
gmysql-user=isudns
gmysql-dbname=isudns
gmysql-password=isudns
local-port=53
security-poll-suffix=
setgid=pdns
setuid=pdns
cache-ttl=0
negquery-cache-ttl=1
query-cache-ttl=20
zone-cache-refresh-interval=300
zone-metadata-cache-ttl=60

log-dns-queries=no
loglevel=3
log-dns-details=no


distributor-threads=12
