api=yes
api-key=isudns
webserver=yes
include-dir=/etc/powerdns/pdns.d
launch=gsqlite3
local-port=53
security-poll-suffix=
setgid=pdns
setuid=pdns
cache-ttl=0
negquery-cache-ttl=1
query-cache-ttl=20
zone-cache-refresh-interval=300
zone-metadata-cache-ttl=60

log-dns-queries=no
loglevel=3
log-dns-details=no

gsqlite3-database=/var/lib/powerdns/isudns.sqlite3
gsqlite3-pragma-journal-mode=WAL
gsqlite3-pragma-synchronous=2
