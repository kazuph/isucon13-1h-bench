upstream isupipe_app {
    server unix:/dev/shm/isupipe.sock;
    keepalive 1024;
    keepalive_requests 1000000;
    keepalive_timeout 120s;
}

server {
    listen 80 default_server reuseport backlog=65535;
    server_name _;
    return 404;
}

server {
    listen 443 ssl default_server reuseport backlog=65535;
    server_name _;
    ssl_certificate     /etc/nginx/tls/_.t.isucon.dev.crt;
    ssl_certificate_key /etc/nginx/tls/_.t.isucon.dev.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    return 404;
}

server {
    listen 443 ssl;
    server_name u.isucon.dev *.u.isucon.dev;

    ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
    ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;
    client_body_buffer_size 512k;

    location /api {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
        proxy_pass http://isupipe_app;
    }

    location / {
        return 404;
    }
}
