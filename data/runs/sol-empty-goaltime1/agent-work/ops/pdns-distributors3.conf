api=yes
api-key=isudns
webserver=yes
include-dir=/etc/powerdns/pdns.d
launch=gmysql
gmysql-port=3306
gmysql-user=isudns
gmysql-dbname=isudns
gmysql-password=isudns
local-port=53
security-poll-suffix=
setgid=pdns
setuid=pdns
cache-ttl=0
negquery-cache-ttl=1
query-cache-ttl=20
zone-cache-refresh-interval=0
zone-metadata-cache-ttl=0

log-dns-queries=no
loglevel=3
log-dns-details=no


webserver-address=0.0.0.0
webserver-allow-from=127.0.0.1,10.99.0.12
