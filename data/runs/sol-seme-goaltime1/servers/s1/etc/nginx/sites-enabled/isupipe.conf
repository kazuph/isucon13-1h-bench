upstream isupipe_memory {
 server 10.99.0.12:8080;
 keepalive 256;
 keepalive_requests 10000;
}

upstream isupipe_icons {
 server 10.99.0.11:8053;
 keepalive 128;
 keepalive_requests 10000;
}

server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は有効期限がきれています
  ssl_certificate     /etc/nginx/tls/_.t.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.t.isucon.dev.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  location / {
    try_files $uri /index.html;
  }
  location = /api/tag {
    default_type application/json;
    try_files /api-tag.json @application;
  }
  location ~ ^/api/user/[^/]+/icon$ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isupipe_icons;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @application;
  }
  location @application {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isupipe_memory;
  }
  location /api {
    proxy_set_header Host $host;
    proxy_pass http://isupipe_memory;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}