upstream app_backend {
  server unix:/run/isupipe/isupipe.sock;
  keepalive 256;
}

server {
  listen 80 default_server reuseport backlog=4096;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl http2 default_server reuseport backlog=4096;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  ssl_certificate     /etc/nginx/tls/_.t.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.t.isucon.dev.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl http2;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  http2_max_concurrent_streams 1024;

  client_max_body_size 10m;
  client_body_buffer_size 1m;
  root /home/isucon/webapp/public/;
  location / {
    try_files $uri /index.html;
  }
  location /api {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffers 32 64k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 256k;
    proxy_pass http://app_backend;
  }
}
